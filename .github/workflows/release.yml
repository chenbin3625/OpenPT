name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_NAME: openpt
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'chenbin3625/openpt' }}

jobs:
  frontend:
    name: Build Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 打包为单个 tar 再上传，避免 upload/download-artifact 对目录的
      # 相对路径处理差异导致下游 go:embed 找不到 dist
      - name: Package dist
        run: tar -czf openpt-dist.tar.gz -C internal/web dist

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: openpt-dist
          path: openpt-dist.tar.gz
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: openpt-dist

      - name: Extract frontend dist
        run: |
          # internal/web/dist 是入库文件：直接解包会留下旧 hash 的产物，
          # 然后被 go:embed 一起打进二进制，所以先清空再解包。
          rm -rf internal/web/dist
          tar -xzf openpt-dist.tar.gz -C internal/web

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test & Race detector
        run: go test -race ./...

      # 发布用的 15 个平台此前只在打 tag 时才真正编译，交叉编译问题会拖到发版那一刻
      # 才暴露。这里在每次 CI 都跑一遍交叉编译冒烟。
      - name: Cross-compile smoke test
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 linux/arm/v7 linux/386 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 windows/386 \
            freebsd/amd64 freebsd/arm64 \
            openbsd/amd64 openbsd/arm64 \
            netbsd/amd64 netbsd/arm64; do
            os="${target%%/*}"
            rest="${target#*/}"
            arch="${rest%%/*}"
            arm=""
            case "$rest" in
              */*) arm="${rest#*/}" ;;
            esac

            echo "::group::cross-compile ${target}"
            if [ -n "$arm" ]; then
              env CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$arm" \
                go build -o /dev/null ./cmd/openpt
            else
              env CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -o /dev/null ./cmd/openpt
            fi
            echo "::endgroup::"
          done

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          # 不加这三个参数时该 action 会用自带的 stable Go 重新 checkout 一次仓库，
          # 与 go.mod 声明的工具链不一致。
          go-version-file: go.mod
          repo-checkout: false

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, test]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: openpt-dist

      - name: Extract frontend dist
        run: |
          rm -rf internal/web/dist
          tar -xzf openpt-dist.tar.gz -C internal/web

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          suffix="${GOOS}-${GOARCH}"
          if [ -n "${GOARM:-}" ]; then suffix="${suffix}v${GOARM}"; fi
          mkdir -p "dist/${APP_NAME}-${version}-${suffix}"
          binary="${APP_NAME}"
          if [ "${GOOS}" = "windows" ]; then binary="${APP_NAME}.exe"; fi
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o "dist/${APP_NAME}-${version}-${suffix}/${binary}" \
            ./cmd/openpt
          cp README.md examples/config.example.toml "dist/${APP_NAME}-${version}-${suffix}/"
          cp -R clients "dist/${APP_NAME}-${version}-${suffix}/clients"
          cd dist
          if [ "${GOOS}" = "windows" ]; then
            archive="${APP_NAME}-${version}-${suffix}.zip"
            zip -r "$archive" "${APP_NAME}-${version}-${suffix}"
          else
            archive="${APP_NAME}-${version}-${suffix}.tar.gz"
            tar -czf "$archive" "${APP_NAME}-${version}-${suffix}"
          fi
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenPT ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  dockerhub:
    name: Publish Docker Hub Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check Docker Hub secrets
        run: |
          # 之前缺 secret 时只打 warning 并跳过，整个 workflow 仍然是绿的，
          # 结果是 tag 发了但镜像没发却看不出来。这里改成直接失败。
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build metadata
        id: docker-build-meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 预发布 tag（例如 v0.3.0-rc1）不再生成 latest / 次版本别名，
      # 避免把预发布或回滚版本顶成 latest；回滚时请手动重推目标版本的 tag。
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.docker-build-meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.docker-build-meta.outputs.date }}
