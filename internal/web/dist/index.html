<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
    <meta name="description" content="OpenPT 保种状态实时监控面板">
    <title>OpenPT 监控面板</title>
    <link rel="icon" href="/openpt-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app-645c6d6f51.css">
    <script>
        // 首屏前同步应用主题，避免暗色模式下的白屏闪烁
        (function () {
            try {
                var mode = localStorage.getItem('openpt-theme-mode') || 'auto';
                var dark = mode === 'dark' || (mode === 'auto' &&
                    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script src="/assets/app-cc28b1e54a.js" defer></script>
</body>
</html>
